<!-- Main entry point for the Okuro web frontend application -->
<!doctype html>
<!-- data-appearance IS THE REGISTER'S ONE USER CHOICE. The engine emits both
     grounds and switches on `:root[data-appearance="dark"]`; with the attribute
     absent, :root is the LIGHT ground, so linking the sheet alone would flip the
     whole app white in one step. It is set to `dark` here so the re-theme changes
     WHERE every value comes from without also changing what okuro looks like —
     one variable at a time. Removing it, or driving it from a setting, is the
     light/dark choice, and it is the only thing standing between the two. The
     `color-scheme` style and meta below stay in agreement with it. -->
<html lang="en" data-appearance="dark" style="color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <title>Okuro</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/okuro.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <!-- THE ENGINE SHEET, AND NOW THE ONLY ONE. P5's re-theme: the app reads the
         resolved brand per ground instead of a frozen token dump.

         /tokens.css WAS LINKED FIRST HERE AND IS NOT ANY MORE (2026-09-03, step
         one of the v1 retirement the owner approved as unlink-then-delete). Both
         sheets declared the same consumer names at :root at equal specificity,
         so the later one won — which made the ORDER of two lines the difference
         between the re-theme and a silent revert, with every file still looking
         correct and no other test failing. One sheet cannot be out of order, so
         the trap is gone by construction rather than by assertion.

         WHAT UNLINKING ACTUALLY DROPPED, measured against the two live sheets
         before the edit: 20 names /tokens.css declared that the engine does not
         (--curve-* ×12, --motion-default/-xfast/-xslow, --font-weight-bold/
         -medium/-regular, --font-size-3xl, --spacing-md-plus). ZERO of them is
         read anywhere in this frontend — the only two source hits for any of
         them are a fixture string and its assertion inside the v1 module's own
         test. Every name both sheets declared is unchanged, because the engine
         was already winning it. tokens.css carried no rules of its own beyond
         those declarations: its [data-theme] blocks were empty.

         The engine sheet is the fallback for nothing now. If it fails to load
         the app renders unstyled, which is the honest failure — the old silent
         one repainted okuro in a frozen brand and looked deliberate.

         Not under /api/*: a stylesheet fetch cannot attach a bearer. See
         okuro/design_engine/api.py::engine_css. -->
    <link rel="stylesheet" href="/engine.css" />
    <!-- DOES THIS ENGINE ACTUALLY PAINT `backdrop-filter`? `@supports` CANNOT
         ANSWER THAT, AND THAT IS MEASURED, NOT ASSUMED.
         ==================================================================
         The desktop app is pywebview on WebKitGTK. Probed there 2026-09-17
         (WebKit2 4.1, offscreen window, this machine):

           CSS.supports('backdrop-filter','blur(10px)')      -> true
           CSS.supports('-webkit-backdrop-filter', …)        -> true
           getComputedStyle(plate).backdropFilter            -> "blur(16px)"
           @supports not ((backdrop-filter:…)) block applied -> NO

         It claims support, accepts the value, and paints nothing. So the
         `@supports not` fallback that was supposed to darken the plate where
         there is no glass can NEVER fire on the one engine that needs it —
         the app got no blur AND no compensating veil, which is exactly what
         "still no blur" looked like.

         THERE IS NO FEATURE TEST FOR A PAINT. A page cannot rasterise itself,
         so the only honest in-page signal left is which engine this is. The UA
         is unambiguous here: WebKit without Chrome on X11/Linux is WebKitGTK or
         WPE — real Safari does not run on X11. Chrome and Chromium carry
         "Chrome", Firefox carries neither token.

         IT ONLY EVER DOWNGRADES A DECORATION. Wrong on this line means a
         slightly darker plate, never a broken layout — which is why a sniff is
         affordable here and would not be for anything load-bearing.

         INLINE AND IN `<head>` ON PURPOSE: the attribute has to exist before
         the first paint, or the plate flashes translucent on every launch.
         pywebview's own on-load JS hook runs too late for that. -->
    <!-- AND: DOES THIS ENGINE HONOUR THE REM BASE? WEBKIT DOES NOT, AND THE
         CONSEQUENCE IS EVERY DIMENSION IN THE DESKTOP APP.
         ==================================================================
         The base is authored as a PERCENTAGE on purpose — the owner: *"the base
         value was calculated with % to make the users settings accurate"* — so
         it follows whatever font size the user has set. WebKit clamps a
         RELATIVE root font size to its `minimumLogicalFontSize`, which defaults
         to 9px, and does not clamp an absolute one. 50% of 16 is 8, so:

           engine          authored   used     1rem
           Chromium 145    50%        8px      8px
           WebKitGTK 4.1   50%        9px      9px      <- +12.5%, everywhere

         Measured 2026-09-17 against the built bundle in a WebKit2 4.1 window:
         --sh-strip-h read 72 instead of 64, --sh-s-72 read 81 instead of 72,
         --sh-s-48 read 54 instead of 48. Every pixel of the shell's geometry
         was out by an eighth in the one place it ships. In the SAME engine,
         `font-size:8px` computes to 8px — only the relative form is clamped.

         SO THE REPAIR IS TO RESTATE THE SAME NUMBER ABSOLUTELY, and only when
         the engine got it wrong. The authored percentage is still the source:
         it is read back out of the cascade rather than assumed, so changing
         `50%` in the sheets changes this too and there is no second copy of
         the base to keep in sync. On an engine that computes it correctly
         nothing is written at all and the pure cascade stands.

         `minimum-font-size` in WebKitSettings is 0 and does not govern this;
         `minimumLogicalFontSize` is not exposed by WebKitSettings 4.1, so it
         cannot be turned off from the host side. -->
    <!-- A FILE, NOT AN INLINE SCRIPT, AND THAT IS A CSP FACT RATHER THAN A
         STYLE ONE: okuro serves `script-src 'self'` with no 'unsafe-inline',
         so an inline block here is blocked and reports nothing. Classic tag,
         no defer, after /engine.css — it reads the authored base out of that
         sheet and its attributes must exist before the first paint. -->
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- audit fix 2026-04-27: SW registration moved to external file
         /sw-register.js so we satisfy `script-src 'self'` in CSP without
         needing 'unsafe-inline'. The previous inline block triggered a CSP
         violation in pywebview/Safari. -->
    <script src="/sw-register.js"></script>
  </body>
</html>
