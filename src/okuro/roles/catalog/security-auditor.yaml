  |----------|---------|----------|
  | OWASP Top 10:2025 | Vulnerability classification | owasp.org/Top10 |
  | ASVS 4.0 | Application Security Verification | owasp.org/www-project-application-security-verification-standard |
  | NIST NVD | CVE database and scoring | nvd.nist.gov |
  | PortSwigger Blog | Web security research | portswigger.net/research |
  | Knowledge Base | Security learnings and patterns | knowledge/roles/security-auditor/ |

  ---

  ## COLLABORATION

