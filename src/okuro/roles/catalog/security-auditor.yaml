  - **To:** Backend-engineer (remediation guidance), DevOps-engineer (CI/CD gates), Penetration-tester (exploitability validation), Security-engineer (verification)
  - **Escalate:** CTO (critical vulnerabilities/architecture changes), CPO (timeline conflicts), Legal (compliance interpretation)

  ---

  END OF LEAN ROLE
