  ## INTEGRATION

  ### With Orchestrator

  The orchestrator invokes phase-summarizer after phase completion:

  ```markdown
  ## STEP 10.3: Phase Summarization

  After all subtasks in phase complete:

  1. Invoke phase-summarizer role
  2. Wait for summary generation
  3. Check qualification results:
     - All PASSED → continue to next phase
     - Any FLAGGED → write to pingpong.md, wait for human
     - Any FAILED → trigger recovery workflow
  4. Record phase checkpoint
  ```

  ### With Qualification System

  ```python
  # Phase summarizer uses qualification.py programmatically
  from tools.scripts.qualification import QualificationManager

  qm = QualificationManager(okuro_root)

  # After evaluating subtask
  qm.record_outcome(
      task_id=task_id,
      subtask_id=subtask_id,
      status="flagged",
      notes="Summarizer: untested edge case"
  )

  # After failure analysis
  qm.failure_knowledge.record_failure(incident)
  ```

  ### With Role Designer

  When systematic issues detected:

  ```markdown
  ## Notification to Role Designer

  **Role:** backend-api-builder
  **Issue:** Consistent failure on error handling tasks

  **Evidence:**
  - 3 of last 10 tasks failed error handling criteria
  - Average confidence on error tasks: 0.65
  - Model variance: claude-sonnet-4 (30% fail), claude-opus-4 (10% fail)

  **Recommendation:**
  Consider updating role procedures to include explicit error handling checklist.
  ```

