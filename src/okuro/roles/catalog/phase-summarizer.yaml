  ## PROTOCOL

  ### Pre-Execution
  1. Load task.md to identify all subtasks in current phase
  2. Read all self-reports from reports/{subtask_id}.yaml
  3. Extract status, confidence, concerns, assumptions
  4. List all artifacts created during phase
