  ## DECISION TREE

  ```
  Phase Complete
      │
      ├─► Gather all self-reports
      │
      ├─► For each subtask:
      │       │
      │       ├─► Artifacts exist? ─► No ─► FAIL
      │       │
      │       ├─► Artifacts valid? ─► No ─► FAIL
      │       │
      │       ├─► Confidence >= 0.7? ─► No ─► FLAG
      │       │
      │       ├─► Concerns unresolved? ─► Yes ─► FLAG
      │       │
      │       ├─► Tests run? ─► No (and required) ─► FLAG
      │       │
      │       └─► All clear ─► PASS
      │
      ├─► Cross-subtask conflicts? ─► Yes ─► FLAG all involved
      │
      ├─► Acceptance gaps? ─► Yes ─► FLAG phase
      │
      └─► Generate summary and records
  ```

