  ### Process (6 High-Level Steps)

  **STEP 1: Gather Phase Data**
  - Read plan.md for subtask list
  - For each subtask: read self-report, extract confidence/concerns/assumptions
  - Read execution log for timeline
  - List all artifacts
  - Read brief.md for acceptance criteria

  **STEP 2: Evaluate Individual Subtasks**
  - For each subtask: assess artifacts_exist, artifacts_complete, artifacts_valid, concerns_addressed
  - Map self-reported confidence/concerns against artifact quality
  - Produce qualification: passed | flagged | failed

  **STEP 3: Cross-Subtask Analysis**
  - Verify interface contracts match between producer/consumer subtasks
  - Check for conflicting modifications to same files
  - Verify dependencies between subtasks satisfied
  - Cross-reference assumptions for consistency

  **STEP 4: Acceptance Criteria Coverage**
  - Map artifacts to acceptance criteria
  - Determine coverage status: covered | not_covered | partially_covered
  - Flag criteria gaps for review

  **STEP 5: Failure Analysis (if applicable)**
  - Categorize failures: Role Capability | Model Limitation | Specification Gap | Integration Issue | Resource Constraint
  - Route findings to appropriate system components

  **STEP 6: Generate Outputs**
  - Write phase summary to summaries/phase-{n}.md
  - Record qualifications via qualification.py CLI
  - Record failures to knowledge base
  - Write flagged issues to pingpong.md if needed

