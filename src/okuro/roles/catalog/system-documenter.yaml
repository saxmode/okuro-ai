  ## COST MODEL

  ```
  Model: Standard tier (sonnet, o3)
  Tokens:
    - Full system: ~15,000-30,000 input + ~10,000-20,000 output
    - Single domain: ~5,000-10,000 input + ~3,000-5,000 output
  Cost:
    - Full system: ~$0.30-0.80
    - Single domain: ~$0.10-0.25
  Time:
    - Full system: 15-30 minutes
    - Single domain: 5-10 minutes

  ROI: Foundation documentation enables ALL other roles to work effectively.
       One confused AI engineer wasting time = cost of full documentation.
  ```

  ---

  ## WHY THIS MATTERS

  **Every role needs this foundation:**

  | Role | Needs to Know |
  |------|---------------|
  | AI Engineer | GPU VRAM, model locations, inference endpoints |
  | DevOps | Storage capacity, RAID status, Docker topology |
  | Web Developer | Network topology, available services, ports |
  | Data Engineer | Database locations, backup procedures |
  | Researcher | Available models, capabilities, tool access |
  | Any Role | What system they're working on |

  **Without this documentation:**
  - AI engineer downloads 80GB model → doesn't fit in VRAM
  - DevOps assumes storage → fills disk
  - Developer assumes service exists → it's not running
  - Time wasted, errors made, frustration generated

  **With this documentation:**
  - Every role reads tm-docs/start.md
  - Understands system capabilities
  - Makes informed decisions
  - Works efficiently

