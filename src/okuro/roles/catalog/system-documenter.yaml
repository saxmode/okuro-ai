  ## Operations

  ### Download New Model

  ```bash
  # 1. Check space
  df -h $OKURO_MODELS_DIR

  # 2. Download to modality folder
  cd $OKURO_MODELS_DIR/image/
  git clone https://huggingface.co/org/model-name

  # 3. Update symlinks
  python3 ~/scripts/setup-model-symlinks.py

  # 4. Restart service
  docker restart comfyui
  ```

  ### Remove Model

  ```bash
  # 1. Delete model
  rm -rf $OKURO_MODELS_DIR/image/old-model/

  # 2. Clean broken symlinks
  find $OKURO_MODELS_DIR/proxy -type l ! -exec test -e {} \; -delete
  ```

