  ## DISCOVERY PROTOCOLS

  ### 1. HARDWARE DISCOVERY

  ```bash
  # CPU
  cat /proc/cpuinfo | grep "model name" | head -1
  nproc
  lscpu | grep -E "^CPU|^Core|^Thread|^Socket"

  # Memory
  free -h
  cat /proc/meminfo | grep -E "^MemTotal|^MemFree|^MemAvailable|^SwapTotal"

  # GPU
  nvidia-smi --query-gpu=name,memory.total,memory.free,driver_version,cuda_version --format=csv
  nvidia-smi

  # Storage Devices
  lsblk -o NAME,SIZE,TYPE,MOUNTPOINT,FSTYPE
  smartctl -a /dev/nvme0n1  # Health status
  cat /proc/mdstat  # RAID status

  # PCI Devices (for inventory)
  lspci | grep -E "VGA|3D|Network|SATA|NVMe"
  ```

  **OUTPUT: tm-docs/system/hardware.md**

  ```markdown
  ## Hardware Summary

  | Component | Specification |
  |-----------|--------------|
  | CPU | {cpu_model} ({cores}C/{threads}T @ {base_clock} base) |
  | RAM | {ram_total} {ram_type} |
  | GPU | {gpu_model} ({vram} VRAM) |
  | Boot Drive | {size} NVMe ({boot_model}) |
  | Model Store | {size} NVMe (dedicated AI models) |
  | RAID Array | {raid_size} RAID1 (2x {size} HDD) |
  | Backup Drive | {size} HDD |

  ## GPU Capabilities

  | Property | Value |
  |----------|-------|
  | CUDA Cores | {cuda_cores} |
  | VRAM | {vram} |
  | Driver | 550.xxx |
  | CUDA Version | 12.x |
  | Power Limit | 300W |

  **Implications for AI:**
  - Can run 70B parameter models quantized (AWQ/GPTQ)
  - Can run FLUX.1-dev at full precision
  - Can run video generation (HunyuanVideo, LTX-Video)
  - Simultaneous inference possible with VRAM management
  ```

  ### 2. STORAGE DISCOVERY

  ```bash
  # Mount points
  df -h
  mount | grep -E "^/dev"

  # RAID status
  cat /proc/mdstat
  mdadm --detail /dev/{raid_dev}

  # Disk health
  smartctl -H /dev/nvme0n1
  smartctl -H /dev/sda

  # Large directories
  du -sh ~/* 2>/dev/null | sort -hr | head -20
  du -sh $OKURO_MODELS_DIR/* 2>/dev/null | sort -hr

  # Find space hogs
  ncdu ~  # if available
  ```

  **OUTPUT: tm-docs/system/storage.md**

  ```markdown
  ## Storage Layout

  | Mount Point | Device | Size | Used | Purpose |
  |-------------|--------|------|------|---------|
  | `/` | {root_device} | {size} | {used} | Root + Home |
  | `{model_store}` | {model_device} | {size} | {used} | AI Model Store |
  | `{bulk_mount}` | {raid_dev} (RAID1) | {size} | {used} | Archival + Cold Storage |
  | `{backup_mount}` | {backup_device} | {size} | {used} | Backup Disk |

  ## AI Model Storage

  **Location:** `{model_store}/`
  **Capacity:** {size} ({used} used, {free} free)
  **Organization:** Modality-based (text/, image/, video/, audio/, voice/, vision/, loras/)

  See: [AI Models Storage Logic](../capabilities/ai-models-storage.md)

  ## Capacity Alerts

  | Threshold | Action |
  |-----------|--------|
  | >80% on the model store | Archive unused models to the archival volume |
  | >90% on / | Clean caches, move large files |
  | RAID degraded | IMMEDIATE: Replace failed disk |
  ```

  ### 3. NETWORK DISCOVERY

  ```bash
  # Interfaces
  ip addr show
  ip route

  # DNS configuration
  cat /etc/resolv.conf
  cat /etc/hosts
  ls -la /etc/dnsmasq.d/
  cat /etc/dnsmasq.d/*.conf

  # Listening ports
  ss -tlnp
  netstat -tlnp 2>/dev/null

  # Firewall
  sudo ufw status verbose
  sudo iptables -L -n

  # Docker networks
  docker network ls
  docker network inspect bridge
  ```

  **OUTPUT: tm-docs/system/network.md**

  ```markdown
  ## Network Configuration

  | Property | Value |
  |----------|-------|
  | Hostname | demo-host |
  | Primary IP | <primary-ip> |
  | Domain | demo.lan |
  | DNS Server | dnsmasq (local) |

  ## DNS Configuration

  **dnsmasq** serves `*.demo.lan` from `/etc/dnsmasq.d/demo.conf`

  | Subdomain | Service | Port |
  |-----------|---------|------|
  | comfyui.demo.lan | ComfyUI | 8188 |
  | n8n.demo.lan | n8n | 5678 |
  | grafana.demo.lan | Grafana | 3001 |
  | open-webui.demo.lan | Open WebUI | 3000 |

  ## Reverse Proxy

  **Caddy** runs HTTP-only on port 80.
  - No HTTPS (LAN-only, no public exposure)
  - Per-site security headers
  - Config: `/etc/caddy/Caddyfile`

  ## Docker Networks

  | Network | Driver | Services |
  |---------|--------|----------|
  | bridge | bridge | Default containers |
  | supabase_default | bridge | Supabase stack |
  | monitoring_default | bridge | Monitoring stack |
  ```

  ### 4. SERVICE DISCOVERY

  ```bash
  # Systemd services (running)
  systemctl list-units --type=service --state=running

  # Systemd services (all)
  systemctl list-unit-files --type=service | grep enabled

  # Docker containers
  docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"

  # Docker compose projects
  find ~ -name "docker-compose.yml" -o -name "docker-compose.yaml" 2>/dev/null
  find $OKURO_WORKSPACE/tm-docker -name "docker-compose.yml"

  # Cron jobs
  crontab -l
  cat /etc/crontab
  ls /etc/cron.d/
  ```

  **OUTPUT: tm-docs/system/services.md + tm-docs/inventory/docker-services.md**

  ### 5. AI STACK DISCOVERY

  ```bash
  # Model inventory
  ls -la $OKURO_MODELS_DIR/
  du -sh $OKURO_MODELS_DIR/*/ | sort -hr

  # Model counts by modality
  find $OKURO_MODELS_DIR/image -maxdepth 1 -type d | wc -l
  find $OKURO_MODELS_DIR/video -maxdepth 1 -type d | wc -l
  find $OKURO_MODELS_DIR/text -maxdepth 1 -type d | wc -l

  # Inference endpoints
  docker ps | grep -E "llama|openai|xtts|comfyui|forge|automatic"

  # GPU utilization
  nvidia-smi --query-gpu=utilization.gpu,memory.used,memory.total --format=csv

  # GGUF models
  find $OKURO_MODELS_DIR -name "*.gguf" -exec du -sh {} \; | sort -hr

  # Symlink structure
  find $OKURO_MODELS_DIR/proxy -type l | wc -l
  ```

  **OUTPUT: tm-docs/capabilities/ai-models.md + tm-docs/capabilities/ai-inference.md**

  ### 6. CLI TOOLS DISCOVERY

  ```bash
  # AI CLI tools
  which claude gemini codex 2>/dev/null
  claude --version 2>/dev/null
  gemini --version 2>/dev/null
  codex --version 2>/dev/null

  # Python environment
  python3 --version
  pip list | wc -l
  which python3

  # Node environment
  node --version
  npm --version
  which node

  # System tools
  which docker docker-compose git rsync
  ```

  **OUTPUT: tm-docs/capabilities/tools.md**

  ### 7. MCP SERVER DISCOVERY

  ```bash
  # Claude MCP config
  cat ~/.claude/claude_desktop_config.json 2>/dev/null
  cat ~/.claude/settings.json 2>/dev/null | jq '.mcpServers'

  # List configured servers
  # Parse from config files
  ```

  **OUTPUT: tm-docs/capabilities/mcp-servers.md**

