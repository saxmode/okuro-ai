  ## INVOCATION

  ### As Orchestrated Role
  ```bash
  claude -p --model sonnet "Execute role: roles/system/system-documenter.md
    Task ID: {id}
    Subtask: DOCUMENT_SYSTEM
    Scope: {full | hardware | network | storage | services | ai-stack | domain | service | project}
    Target: {target}"
  ```

  ### Standalone - Full System
  ```bash
  claude -p --model sonnet "Execute role: roles/system/system-documenter.md
    Task: Document full system infrastructure
    Scope: full
    Target: tm-docs/"
  ```

  ### Standalone - Specific Domain
  ```bash
  claude -p --model sonnet "Execute role: roles/system/system-documenter.md
    Task: Document AI stack
    Scope: ai-stack
    Target: tm-docs/capabilities/"
  ```

  ### Standalone - Single Service
  ```bash
  claude -p --model sonnet "Execute role: roles/system/system-documenter.md
    Task: Document service
    Scope: service:comfyui
    Target: tm-docs/runbooks/services/comfyui.md"
  ```

  ### Scope Options
  - `full` - Complete system documentation (hardware to services)
  - `hardware` - CPU, GPU, RAM, storage devices
  - `network` - Interfaces, DNS, firewall, routing
  - `storage` - Mount points, RAID, volumes, capacity
  - `services` - All running services (systemd + Docker)
  - `ai-stack` - AI models, inference, capabilities
  - `domain:{name}` - Specific tm-* domain
  - `service:{name}` - Single service documentation
  - `project:{name}` - Development project documentation

