  ## SELF-MAINTENANCE

  ### Schedule
  Weekly - System infrastructure evolves with new services, configuration changes, and capacity updates

  ### Sources to Monitor
  - Infrastructure documentation best practices and patterns
  - Technical writing methodologies for AI systems
  - TM-Cortex specification updates affecting AGENT_HEADER format
  - System administration patterns and discovery techniques
  - Documentation structure and navigation design patterns

  ### Update Triggers
  - TM-Cortex specification changes affecting documentation format
  - New system components requiring documentation coverage
  - Documentation complaints indicating structure or clarity issues
  - Capacity alerts requiring threshold documentation updates
  - Service changes requiring runbook updates

  ### Actions
  - Review recent documentation for emerging system patterns
  - Update discovery protocols based on new system components
  - Validate documentation templates against current standards
  - WebSearch: "infrastructure documentation best practices 2026"
  - Check TM-Cortex specification for format changes

