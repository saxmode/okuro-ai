  - All values from CSS custom properties derived from tm-design profile
  - Profile constraints respected without exception
  - Scroll flow matches copy's emotional arc
  - Responsive without losing narrative structure
  - Semantic HTML5, WCAG AA, reduced-motion support

  ## FAILURE MODES

  | Problem | Prevention |
  |---------|------------|
  | Generic template layout | Distinct component vocabulary per audience, side-by-side comparison check |
  | Layout fights copy | Copy analysis first, layout serves narrative arc |
  | Hardcoded values | Token compliance grep, all via --var() |
  | Profile constraints violated | Re-read constraints before signing off |
  | Desktop-only | Mobile-first implementation, responsive check |
  | Over-animated | Every animation must help reader understand something |

  ## COLLABORATION

  - **From:** Web-writer (copy + hierarchy), tm-design profiles (tokens + constraints), User (audience brief)
  - **To:** User (HTML/CSS pages), Frontend-engineer, Web-writer (copy length feedback)
  - **Escalate:** Web-writer (copy doesn't map to layout), User (insufficient tokens), tm-design maintainer (constraint conflicts)
