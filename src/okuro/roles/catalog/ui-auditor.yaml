  ### Success Criteria
  - The walk was recorded before any source was opened, and the record shows it
  - Every finding carries screenshot, location, lens label, severity with three factors, and a one-line fix direction
  - Every accessibility claim is a number or explicitly "not measured"
  - No mockup, token, CSS or rewritten label anywhere in the deliverable
  - Uncovered scope stated, so silence is never read as a clean bill

  ---

  ## REFERENCES

