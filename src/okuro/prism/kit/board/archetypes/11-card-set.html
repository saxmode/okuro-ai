<!-- archetype: card-set / capability (kit-spec 3b · meridian slide 2). Slots: eyebrow, title, stats(row), cards[3-5] -->
<section class="slide" data-archetype="card-set">
  <div class="slide-inner">
    <div class="slide-eyebrow" data-slot="eyebrow"><span class="slide-num">11</span> What it can do</div>
    <h1 class="slide-title" data-slot="title">Four capabilities, one <span class="accent">substrate</span></h1>
    <div class="stat-row" data-slot="stats">
      <div class="stat-cell"><div class="stat-num ok">4</div><div class="stat-lbl">modalities local</div></div>
      <div class="stat-cell"><div class="stat-num">48<span style="font-size:16px">GB</span></div><div class="stat-lbl">VRAM on tap</div></div>
      <div class="stat-cell"><div class="stat-num info">3</div><div class="stat-lbl">edition tiers</div></div>
      <div class="stat-cell"><div class="stat-num gold">0</div><div class="stat-lbl">vendor lock-in</div></div>
    </div>
    <div class="card-grid" data-slot="cards" style="grid-template-columns:repeat(4,1fr)">
      <div class="cap-card"><div class="cap-card-icon">🧠</div><div class="cap-card-name">Reason</div><div class="cap-card-desc">Local LLMs, routed by capability</div></div>
      <div class="cap-card"><div class="cap-card-icon">🖼</div><div class="cap-card-name">See</div><div class="cap-card-desc">Image gen + vision on device</div></div>
      <div class="cap-card"><div class="cap-card-icon">🔊</div><div class="cap-card-name">Speak</div><div class="cap-card-desc">TTS / STT with no cloud hop</div></div>
      <div class="cap-card"><div class="cap-card-icon">🎬</div><div class="cap-card-name">Render</div><div class="cap-card-desc">Video from the same scene IR</div></div>
    </div>
  </div>
</section>
