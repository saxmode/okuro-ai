<!doctype html>
<html lang="en" data-theme="okuro">
<head>
<meta charset="utf-8">
<title>prism · board kit — height calibration corpus</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../board/tokens.css">
<link rel="stylesheet" href="../board/theme.css">
<link rel="stylesheet" href="../board/components.css">
<link rel="stylesheet" href="../board/components-ext.css">
<style>
  /* the corpus is a flat list of measurable specimens — no gallery chrome.
     Each .cal-specimen has an explicit col-span pixel width; its height (box
     offsetHeight, no padding/border) IS the component's rendered height at that
     (items, chars, col_span). Reveal is disabled so nothing measures at
     opacity/translate mid-transition. */
  body { padding: 40px; background: var(--bg-base); }
  .cal-specimen { margin: 0 0 48px; }
  .reveal, .reveal.in-view { opacity: 1 !important; transform: none !important; transition: none !important; }
  #cal-meta { font-family: var(--font-mono); font-size: 12px; color: var(--fg-tertiary); margin-bottom: 24px; }
</style>
<script src="calibration.js" defer></script>
</head>
<body>
<div id="cal-meta">prism height-calibration corpus · brand <span id="cal-brand"></span> · <span id="cal-count"></span> specimens</div>
<div id="cal-root"></div>
<script>
  window.addEventListener("prism-cal-ready", function () {
    document.getElementById("cal-brand").textContent = document.documentElement.getAttribute("data-theme");
    document.getElementById("cal-count").textContent =
      document.getElementById("cal-root").getAttribute("data-specimen-count");
  });
</script>
</body>
</html>
